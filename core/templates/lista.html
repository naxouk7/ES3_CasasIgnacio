<!DOCTYPE html>
<html>
<head><title>Lista de Inscripciones</title></head>
<body>
    <h1>Inscripciones del Campeonato</h1>
    <a href="{% url 'crear' %}"><button>+ Nueva Inscripción</button></a>
    <br><br>
    <table border="1" cellpadding="5">
        <tr>
            <th>Nombre</th><th>Edad</th><th>Cupos</th><th>Estado</th><th>Motivo</th><th>Acciones</th>
        </tr>
        {% for reg in registros %}
        <tr>
            <td>{{ reg.nombre }}</td>
            <td>{{ reg.edad }}</td>
            <td>{{ reg.cupos }}</td>
            <td>{{ reg.estado }}</td>
            <td>{{ reg.motivo }}</td>
            <td>
                <a href="{% url 'editar' reg.pk %}">Editar</a> | 
                <a href="{% url 'eliminar' reg.pk %}">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="6">No hay inscripciones registradas.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
